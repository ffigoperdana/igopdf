services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-igopdf}
      POSTGRES_USER: ${DB_USER:-igopdf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-igopdf_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DB_USER:-igopdf} -d ${DB_NAME:-igopdf}']
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ['node', 'dist/scripts/migrate.js']
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-igopdf}
      DB_USER: ${DB_USER:-igopdf}
      DB_PASSWORD: ${DB_PASSWORD:-igopdf_password}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # The application image runs non-root. This one-shot initializer is the only
  # service allowed to fix ownership on the two writable Docker volumes, which
  # also makes upgrades from the older root-owned layout safe.
  storage-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: '0:0'
    command:
      - sh
      - -ec
      - |
        install -d -o 10001 -g 10001 -m 0700 /var/lib/igo-jobs /var/lib/igo-support
        chown -R 10001:10001 /var/lib/igo-jobs /var/lib/igo-support
        chmod 0700 /var/lib/igo-jobs /var/lib/igo-support
    volumes:
      - pdf_jobs:/var/lib/igo-jobs
      - support_assets:/var/lib/igo-support
    restart: 'no'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-igopdf}
      DB_USER: ${DB_USER:-igopdf}
      DB_PASSWORD: ${DB_PASSWORD:-igopdf_password}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SUPPORT_STORAGE_DIR: /var/lib/igo-support
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      SESSION_TIMEOUT_HOURS: ${SESSION_TIMEOUT_HOURS:-3}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      SERVER_COMPRESSION_ENABLED: ${SERVER_COMPRESSION_ENABLED:-true}
      COMPRESSION_JOBS_DIR: /var/lib/igo-jobs
      CLIENT_COMPRESSION_MAX_BYTES: ${CLIENT_COMPRESSION_MAX_BYTES:-104857600}
      SERVER_BALANCED_MAX_BYTES: ${SERVER_BALANCED_MAX_BYTES:-524288000}
      SERVER_COMPRESSION_MAX_BYTES: ${SERVER_COMPRESSION_MAX_BYTES:-1073741824}
      COMPRESSION_UPLOAD_CHUNK_BYTES: ${COMPRESSION_UPLOAD_CHUNK_BYTES:-26214400}
      COMPRESSION_UPLOAD_IDLE_TIMEOUT_MS: ${COMPRESSION_UPLOAD_IDLE_TIMEOUT_MS:-1800000}
      COMPRESSION_UPLOAD_MAX_AGE_MS: ${COMPRESSION_UPLOAD_MAX_AGE_MS:-10800000}
      COMPRESSION_DISK_HEADROOM_MULTIPLIER: ${COMPRESSION_DISK_HEADROOM_MULTIPLIER:-3}
      COMPRESSION_DISK_MINIMUM_FREE_BYTES: ${COMPRESSION_DISK_MINIMUM_FREE_BYTES:-1073741824}
      COMPRESSION_JOB_TIMEOUT_MS: ${COMPRESSION_JOB_TIMEOUT_MS:-2700000}
      COMPRESSION_RETENTION_MS: ${COMPRESSION_RETENTION_MS:-900000}
      COMPRESSION_WORKER_POLL_MS: ${COMPRESSION_WORKER_POLL_MS:-2000}
      SERVER_DOCX_ENABLED: ${SERVER_DOCX_ENABLED:-true}
      DOCX_JOBS_DIR: /var/lib/igo-jobs
      DOCX_CLIENT_MAX_BYTES: ${DOCX_CLIENT_MAX_BYTES:-52428800}
      DOCX_MAX_UPLOAD_BYTES: ${DOCX_MAX_UPLOAD_BYTES:-52428800}
      DOCX_NATIVE_MAX_PAGES: ${DOCX_NATIVE_MAX_PAGES:-200}
      DOCX_OCR_MAX_PAGES: ${DOCX_OCR_MAX_PAGES:-100}
      DOCX_VISUAL_MAX_PAGES: ${DOCX_VISUAL_MAX_PAGES:-100}
      DOCX_UPLOAD_CHUNK_BYTES: ${DOCX_UPLOAD_CHUNK_BYTES:-10485760}
      DOCX_UPLOAD_IDLE_TIMEOUT_MS: ${DOCX_UPLOAD_IDLE_TIMEOUT_MS:-1800000}
      DOCX_UPLOAD_MAX_AGE_MS: ${DOCX_UPLOAD_MAX_AGE_MS:-10800000}
      DOCX_DISK_HEADROOM_MULTIPLIER: ${DOCX_DISK_HEADROOM_MULTIPLIER:-3}
      DOCX_DISK_MINIMUM_FREE_BYTES: ${DOCX_DISK_MINIMUM_FREE_BYTES:-1073741824}
      DOCX_JOB_TIMEOUT_MS: ${DOCX_JOB_TIMEOUT_MS:-2700000}
      DOCX_RETENTION_MS: ${DOCX_RETENTION_MS:-900000}
      DOCX_WORKER_POLL_MS: ${DOCX_WORKER_POLL_MS:-2000}
      SUPPORT_UPLOAD_CHUNK_BYTES: ${SUPPORT_UPLOAD_CHUNK_BYTES:-26214400}
      SUPPORT_UPLOAD_IDLE_TIMEOUT_MS: ${SUPPORT_UPLOAD_IDLE_TIMEOUT_MS:-3600000}
      SUPPORT_UPLOAD_MAX_AGE_MS: ${SUPPORT_UPLOAD_MAX_AGE_MS:-86400000}
      COMPLAINT_ATTACHMENT_RETENTION_MS: ${COMPLAINT_ATTACHMENT_RETENTION_MS:-172800000}
      GUIDE_PDF_MAX_BYTES: ${GUIDE_PDF_MAX_BYTES:-104857600}
      GUIDE_VIDEO_MAX_BYTES: ${GUIDE_VIDEO_MAX_BYTES:-104857600}
      SUPPORT_DISK_MINIMUM_FREE_BYTES: ${SUPPORT_DISK_MINIMUM_FREE_BYTES:-536870912}
      MALWARE_SCAN_ENABLED: ${MALWARE_SCAN_ENABLED:-false}
      MALWARE_SCAN_REQUIRED: ${MALWARE_SCAN_REQUIRED:-true}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      MALWARE_SCAN_TIMEOUT_MS: ${MALWARE_SCAN_TIMEOUT_MS:-900000}
      MALWARE_SCAN_MAX_BYTES: ${MALWARE_SCAN_MAX_BYTES:-1073741824}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-10.10.10.25}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-10000}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-15000}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      EMAIL_DOMAIN: ${EMAIL_DOMAIN:-bpdp.or.id}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8081}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    volumes:
      - pdf_jobs:/var/lib/igo-jobs
      - support_assets:/var/lib/igo-support
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped

  pdf-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-igopdf}
      DB_USER: ${DB_USER:-igopdf}
      DB_PASSWORD: ${DB_PASSWORD:-igopdf_password}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SERVER_COMPRESSION_ENABLED: ${SERVER_COMPRESSION_ENABLED:-true}
      COMPRESSION_JOBS_DIR: /var/lib/igo-jobs
      CLIENT_COMPRESSION_MAX_BYTES: ${CLIENT_COMPRESSION_MAX_BYTES:-104857600}
      SERVER_BALANCED_MAX_BYTES: ${SERVER_BALANCED_MAX_BYTES:-524288000}
      SERVER_COMPRESSION_MAX_BYTES: ${SERVER_COMPRESSION_MAX_BYTES:-1073741824}
      COMPRESSION_UPLOAD_IDLE_TIMEOUT_MS: ${COMPRESSION_UPLOAD_IDLE_TIMEOUT_MS:-1800000}
      COMPRESSION_UPLOAD_MAX_AGE_MS: ${COMPRESSION_UPLOAD_MAX_AGE_MS:-10800000}
      COMPRESSION_JOB_TIMEOUT_MS: ${COMPRESSION_JOB_TIMEOUT_MS:-2700000}
      COMPRESSION_RETENTION_MS: ${COMPRESSION_RETENTION_MS:-900000}
      COMPRESSION_WORKER_POLL_MS: ${COMPRESSION_WORKER_POLL_MS:-2000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    volumes:
      - pdf_jobs:/var/lib/igo-jobs
    cpus: 1.5
    mem_limit: 4g
    restart: unless-stopped

  docx-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ['node', 'dist/docx-worker.js']
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-igopdf}
      DB_USER: ${DB_USER:-igopdf}
      DB_PASSWORD: ${DB_PASSWORD:-igopdf_password}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SERVER_DOCX_ENABLED: ${SERVER_DOCX_ENABLED:-true}
      DOCX_JOBS_DIR: /var/lib/igo-jobs
      DOCX_CLIENT_MAX_BYTES: ${DOCX_CLIENT_MAX_BYTES:-52428800}
      DOCX_MAX_UPLOAD_BYTES: ${DOCX_MAX_UPLOAD_BYTES:-52428800}
      DOCX_NATIVE_MAX_PAGES: ${DOCX_NATIVE_MAX_PAGES:-200}
      DOCX_OCR_MAX_PAGES: ${DOCX_OCR_MAX_PAGES:-100}
      DOCX_VISUAL_MAX_PAGES: ${DOCX_VISUAL_MAX_PAGES:-100}
      DOCX_UPLOAD_CHUNK_BYTES: ${DOCX_UPLOAD_CHUNK_BYTES:-10485760}
      DOCX_UPLOAD_IDLE_TIMEOUT_MS: ${DOCX_UPLOAD_IDLE_TIMEOUT_MS:-1800000}
      DOCX_UPLOAD_MAX_AGE_MS: ${DOCX_UPLOAD_MAX_AGE_MS:-10800000}
      DOCX_DISK_HEADROOM_MULTIPLIER: ${DOCX_DISK_HEADROOM_MULTIPLIER:-3}
      DOCX_DISK_MINIMUM_FREE_BYTES: ${DOCX_DISK_MINIMUM_FREE_BYTES:-1073741824}
      DOCX_JOB_TIMEOUT_MS: ${DOCX_JOB_TIMEOUT_MS:-2700000}
      DOCX_RETENTION_MS: ${DOCX_RETENTION_MS:-900000}
      DOCX_WORKER_POLL_MS: ${DOCX_WORKER_POLL_MS:-2000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    volumes:
      - pdf_jobs:/var/lib/igo-jobs
    cpus: 1.5
    mem_limit: 4g
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped

  # Opt-in security profile: keep port 3310 private to the compose network.
  # Enable with `docker compose --profile security up -d` together with
  # MALWARE_SCAN_ENABLED=true. ClamAV needs substantial RAM for signatures.
  clamav:
    build:
      context: .
      dockerfile: deploy/clamav.Dockerfile
    profiles: ['security']
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      CLAMAV_NO_MILTERD: 'true'
      FRESHCLAM_CHECKS: ${FRESHCLAM_CHECKS:-12}
    volumes:
      - clamav_database:/var/lib/clamav
    expose:
      - '3310'
    cpus: 1.0
    mem_limit: 4g
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '${HTTP_PORT:-8081}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped

volumes:
  postgres_data:
  pdf_jobs:
  support_assets:
  clamav_database:
